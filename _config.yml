# ─────────────────────────────────────────────────────────────────
# rishabh0111.github.io · _config.yml
# GitHub Pages compatible. No permalink set here; controlled
# per-post via front matter (blogs) or left to Jekyll default (news).
# ─────────────────────────────────────────────────────────────────

# `title` is the wordmark, the <title> suffix, and the footer line.
title:       "Rishabh Sharma"
description: "Engineer working across AI agents, backends, and full-stack product. Notes on the systems I build and what breaks in them."
baseurl:     ""        # "" for username.github.io · "/repo-name" for project pages
url:         "https://rishabh0111.github.io"

author:
  name:  "Rishabh Sharma"
  email: "rishabhsharma8912@gmail.com"

# ── Social share image ─────────────────────────────────────────
# One card for every link. jekyll-seo-tag turns this into og:image /
# twitter:image site-wide; individual posts do not set their own.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-card.jpg
  # Vault drafts: see "The vault" below.
  - scope:
      path: "_vault/hld"
      type: vault
    values:
      shelf: HLD
  - scope:
      path: "_vault/lld"
      type: vault
    values:
      shelf: LLD
  - scope:
      path: ""
      type: vault
    values:
      layout: post
      vault: true
      sitemap: false

# ── The vault ─────────────────────────────────────────────────
# /vault holds drafts (the HLD and LLD series) until they are ready.
# Nothing links to it; every vault page is noindex, kept out of the
# sitemap, the feed and the blog listing, and hidden behind a PIN.
# The PIN is a curtain, not a lock: the markdown is in this public
# repo. Change it with:
#   printf 'vault:%s' 1234 | sha256sum
# and paste the hash below. To publish a draft, move it into
# _posts/blogs/, add `categories: blogs` and a /blogs/ permalink.
collections:
  vault:
    output: true
vault_shelves: [HLD, LLD]
vault_pin_sha256: "9769ebe8511077cee44d5daf063360d23b866df627bd979490d23e7c396e9c7a"

# ── Timezone ───────────────────────────────────────────────────
timezone: Asia/Kolkata

# Posts are dated 09:00 IST but may be pushed earlier in the morning.
# Without this, Jekyll silently drops a post whose timestamp is still
# in the future at build time.
future: true

# ── Markdown ───────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

# ── Plugins (all supported natively by GitHub Pages) ──────────
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ── Exclude from build ────────────────────────────────────────
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - dump
  - _templates
  - _preview
  # Local shadcn MCP registry config (React Bits), untracked; not a page.
  - components.json
  # Working notes, not for publication.
  - master_profile.md
  # News is parked for now, not publishing digests yet. Dropping both the
  # listing page and the posts keeps them out of the nav, the home page,
  # the feed and the sitemap. Remove these two lines to bring it back.
  - news
  - _posts/news
