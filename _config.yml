# ─────────────────────────────────────────────────────────────────
# rishabh0111.github.io — _config.yml
# GitHub Pages compatible. No permalink set here — controlled
# per-post via front matter (blogs) or left to Jekyll default (news).
# ─────────────────────────────────────────────────────────────────

# `title` is the wordmark, the <title> suffix, and the footer line.
title:       "Rishabh Sharma"
description: "Engineer working across AI agents, backends, and full-stack product. Notes on the systems I build and what breaks in them."
baseurl:     ""        # "" for username.github.io · "/repo-name" for project pages
url:         "https://rishabh0111.github.io"

author:
  name:  "Rishabh Sharma"
  email: "rishabhsharma8912@gmail.com"

# ── Timezone ───────────────────────────────────────────────────
timezone: Asia/Kolkata

# ── Markdown ───────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

# ── Plugins (all supported natively by GitHub Pages) ──────────
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ── Exclude from build ────────────────────────────────────────
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - dump
  - _templates
  # Private source-of-truth: has a phone number and salary floor in it.
  # Without this line Jekyll copies it verbatim to /master_profile.md.
  - master_profile.md
