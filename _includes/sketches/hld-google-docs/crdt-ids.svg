<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" role="img" aria-labelledby="skx71z5it skx71z5id"><title id="skx71z5it">A sequence CRDT: the same two edits addressed by character id instead of position</title><desc id="skx71z5id">Each character carries a unique id: a is 1, b is 2, c is 3. Alice's insert says insert X with id A1 after id 1. Bob's delete says delete id 3. Each replica applies the two operations in either order and gets a, X, b, with c kept as a hidden tombstone. Nothing needs transforming because ids never shift; the cost is an id on every character and tombstones that stay.</desc><text class="t-ink" x="20" y="22" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">same edits, addressed by id, not by position</text><path class="h-green" d="M19.9 45.1 C19.9 45.1, 19.9 45.1, 19.9 45.1 M19.9 45.1 C19.9 45.1, 19.9 45.1, 19.9 45.1 M21.1 55.5 C20.6 52, 24.5 49.5, 26.4 45.8 M19.8 54.3 C21.3 52.3, 24.6 49.9, 27.8 45.9 M21.7 62.6 C24.4 59.6, 29.5 56.1, 36.7 45.8 M18.9 62.9 C25.6 57, 30.6 51.2, 35.9 45 M22.4 67.5 C29.8 60.6, 39.5 50.6, 44 48.3 M24.1 68.3 C28.7 62.7, 31.8 58.7, 42 48.2 M31.8 67.4 C36.5 63.8, 38.9 62.2, 43.4 54 M32.8 68.4 C35 63.3, 39.1 60, 42.7 55.9 M40.7 66.9 C40.9 66.4, 41.7 66.1, 42.6 65 M40.5 67 C41.2 66.3, 42.1 65.2, 42.6 64.7" stroke-width="1.1"/><path class="s-green" d="M18.9 47 C25.2 43.7, 34.3 44.8, 42.2 46.6 M19.3 45.5 C26.7 45.6, 34.9 45.9, 41.2 45.9 M42.6 44.5 C41.2 51.4, 41.4 62.8, 40 65.4 M41.6 45.9 C41 52.7, 41.4 60, 42.1 68 M40.6 68 C32.3 67.3, 27 67.6, 18 67.5 M42.6 66 C36.5 66.4, 33.3 66.6, 20.6 66.8 M18.9 67.1 C22.3 59.8, 20.7 52.2, 19.1 43.5 M19 65.9 C19.8 60.3, 19.8 55.7, 20.5 44.8" stroke-width="1.4"/><text class="t-soft" x="50" y="56" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="middle">inserted</text><path class="h-soft" d="M143.6 45.3 C143.6 45.3, 143.6 45.3, 143.6 45.3 M143.6 45.3 C143.6 45.3, 143.6 45.3, 143.6 45.3 M144.4