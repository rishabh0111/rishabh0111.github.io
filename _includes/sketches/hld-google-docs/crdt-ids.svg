ont-weight="500" text-anchor="start" dominant-baseline="middle">every replica, in either order:</text><text class="t-ink" x="134" y="322" font-size="19" font-weight="600" text-anchor="end" dominant-baseline="middle">result</text><path class="s-ink" d="M151.4 300.7 C166.6 298.5, 185.2 301.3, 204 301.6 M149.1 300.8 C163.8 299.8, 175.8 299.2, 205.4 299.5 M204.1 300.9 C204.8 309.9, 204.4 322.2, 205 344.2 M206.1 299.8 C205.4 313.7, 207.1 326.7, 205 343.7 M208.2 346 C193.9 345.8, 176.7 343.1, 151.5 344.5 M206.9 343.3 C189.3 343.7, 172.6 344.6, 150.3 343 M151.5 344.7 C148 326, 150.1 310.1, 150.2 298.4 M149.1 342.9 C151.1 332.8, 149.5 320.5, 149.6 299.7" stroke-width="1.6"/><text class="t-ink" x="178" y="323" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="middle">a</text><path class="h-green" d="M206.2 299.8 C206.2 299.8, 206.2 299.8, 206.2 299.8 M206.2 299.8 C206.2 299.8, 206.2 299.8, 206.2 299.8 M206.1 307.7 C209.3 304.4, 211.9 302.8, 212.7 301.3 M206 308.9 C208.4 306.8, 210 304, 213.5 300 M206.2 317.4 C210.1 316.6, 213 311.1, 222.3 301.9 M205.5 318.2 C211.3 312, 215.7 306.6, 222.6 299.8 M205.6 326.3 C211.9 321.7, 214.8 315.7, 227.9 299.4 M205.4 327.6 C212.7 321.5, 218.2 314.3, 229.9 301.4 M204.6 338.4 C217.6 322.9, 231.3 305, 239.7 301.2 M207 337.7 C213.7 326.9, 221 318, 238.3 300.5 M208.6 342.4 C219.9 330.9, 231.8 313.6, 246.8 300.1 M207.4 344 C215.4 333.9, 224.1 325.6, 246.3 299 M215.8 345.9 C232.5 327.5, 245 308.9, 254.2 299.5 M214.8 342.9 C227.4 329.9, 240.3 315.4, 253.3 300 M224.1 346.1 C234.3 333.3, 242.2 321.3, 259.9 298.1 M222.9 343 C237.6 328.3, 250.4 313.2, 260.9 300.7 M233.2 343 C240.1 333.8, 251.4 321.2, 261.4 307.2 M230.3 345 C241.5 333.1, 251.2 319.7, 261.8 307.7 M238.7 343.3 C246.1 336.2, 250.7 329.6, 262.4 316.6 M239.4 345.3 C248.5 335.1, 256.7 323.8, 263.7 316.2 M247.4 345.7 C253.3 340.1, 257.1 331, 260.5 326.9 M247.6 344.6 C249.6 339.8, 253.9 336.9, 262.3 325.9 M255.5 343.1 C255.9 342.1, 258.4 339.2, 263.7 334.6 M255.6 344.3 C2