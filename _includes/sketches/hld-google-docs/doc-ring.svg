<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" role="img" aria-labelledby="sk5trar8t sk5trar8d"><title id="sk5trar8t">Consistent hashing: each document is owned by the next session server clockwise on the ring</title><desc id="sk5trar8d">A ring with four session servers S1 to S4 and documents hashed onto it. doc_42 lands just before S2, so S2 owns it and every editor of doc_42 is routed to S2. If S3 fails, only the documents between S2 and S3 move, to S4; every other document stays where it is.</desc><text class="t-ink" x="20" y="22" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">doc id → hash → next server clockwise</text><path class="s-soft" d="M261.1 101.8 C277.4 102.5, 295.6 111.8, 310.6 119.3 C325.5 126.8, 339.1 135.5, 350.7 146.9 C362.3 158.2, 372.8 173.3, 380.2 187.5 C387.6 201.6, 393 216.7, 395.1 232 C397.1 247.3, 395.9 264.3, 392.4 279.3 C389 294.4, 382.2 309.1, 374.2 322.3 C366.1 335.5, 356.5 348, 344.1 358.6 C331.7 369.3, 315.5 379.2, 299.9 386 C284.2 392.8, 266.8 397.6, 249.9 399.5 C233.1 401.5, 215.3 400.6, 198.6 397.6 C181.9 394.7, 164.6 389.2, 149.6 381.8 C134.6 374.3, 120.1 364.3, 108.5 352.8 C96.9 341.3, 87 327, 79.8 313 C72.6 299, 67.3 284, 65.2 268.6 C63.1 253.3, 63.8 236.1, 67.3 220.7 C70.7 205.3, 77.5 189.5, 85.8 176.3 C94.2 163, 105.4 151.6, 117.6 141.2 C129.8 130.8, 143.9 120.8, 159.3 114 C174.7 107.3, 190.9 102.3, 209.9 100.7 C228.9 99.1, 260.7 102.5, 273.1 104.5 C285.4 106.5, 284.4 110.1, 283.9 112.5 M173.2 107.6 C187.5 100.2, 207.4 100.2, 224.7 99.7 C241.9 99.3, 260.4 101, 276.7 105.1 C293 109.2, 308.6 115.3, 322.6 124.2 C336.7 133, 350.5 145.5, 360.8 158.1 C371.2 170.8, 379.1 185.6, 384.7 200.2 C390.3 214.8, 393.6 230.1, 394.6 245.5 C395.5 260.9, 395 278, 390.6 292.7 C386.1 307.4, 377.5 321, 367.8 333.8 C358.1 346.5, 345.4 359.6, 332.1 369.2 C318.9 378.7, 304.3 386.3, 288.2 391.2 C272.1 396.1, 252.6 398.3, 235.4 398.5 C218.3 398.8, 201.6 397.1, 185.3 392.9 C169 