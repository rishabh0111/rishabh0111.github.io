<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" width="660" role="img" aria-labelledby="skvafw5ut skvafw5ud"><title id="skvafw5ut">Database and Redis sorted set: two layers for finding due executions</title><desc id="skvafw5ud">Timeline from 09:00 to 09:15. The database holds every future execution. Every 5 minutes a pre-loader copies the executions due in the next 5 minutes into a Redis sorted set scored by run time. A dispatcher pops members whose score has passed. A job created at 09:07 to run at 09:08 is written to both layers at once, because the pre-loader for that window has already run.</desc><text class="t-ink" x="20" y="24" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">two layers: the database holds everything, Redis only the next 5 min</text><text class="t-cyan" x="60" y="70" font-size="19" font-weight="600" text-anchor="start" dominant-baseline="middle">database: every execution, months ahead</text><path class="h-cyan" d="M60 84 C60 84, 60 84, 60 84 M60 84 C60 84, 60 84, 60 84 M59.4 92.3 C62.3 92.1, 64.3 89, 68.5 84.1 M59.6 93.6 C62.3 90.8, 63.1 88.6, 68.1 84 M58.3 102.4 C65.6 96.9, 68.9 88, 74 82.3 M60.5 103.4 C63 97.8, 68.4 92.7, 76.5 84.3 M58.8 111.1 C69.9 103.8, 76.2 95.5, 84.9 83.4 M60.5 111.7 C67.2 102.9, 73.7 94.3, 84.8 83 M58.1 121.2 C72.8 107.9, 81.3 94.6, 91.7 85 M59.5 121.5 C69.6 109.6, 78.3 100.6, 91.1 84.6 M66 126.4 C72.2 114.9, 81 107.7, 101.3 82.8 M65 124.7 C76.7 111.2, 89.3 96.5, 99.1 83.1 M71.7 122 C81 114.3, 90.8 100, 105.7 84.5 M72.3 124.6 C83.2 111.2, 94.3 100.9, 107.3 83.3 M82 122.8 C91.5 111.1, 100 101.3, 116.5 82.2 M80.8 123.9 C88.8 114.1, 96.6 105.8, 114.8 84.2 M89.4 125.9 C95.9 116, 101.8 107.9, 123.3 84.8 M89 124.6 C98.5 114.3, 107.2 103, 123.9 83.1 M94.4 124 C101.4 117.5, 112.2 109, 133.7 85.2 M97 124.6 C107.4 111, 121.5 95.2, 132.3 82.9 M105 126.2 C113.5 115.7, 122.6 103, 139.4 84.5 M104.1 125.4 C112 116.1, 118.4 107.9, 138.7 83.5 M112.4 124.6 C120.1 116.9, 129