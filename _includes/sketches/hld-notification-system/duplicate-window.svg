<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" width="660" role="img" aria-labelledby="skhwmzvot skhwmzvod"><title id="skhwmzvot">Where a worker crash leads to a duplicate send</title><desc id="skhwmzvod">A worker claims the delivery, calls the provider, records sent, then acknowledges the queue. A crash before the provider call is safe to retry. A crash after the provider accepted but before sent is recorded is the duplicate window. A crash after sent is recorded is skipped on redelivery.</desc><text class="t-ink" x="20" y="24" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">one delivery, four steps, three places to crash</text><path class="s-ink" d="M19.7 107.3 C62.7 106.8, 104.7 106.5, 161.1 108.8 M19.8 108.4 C71 108.9, 122.9 109.6, 160.1 109.8 M162.1 107.6 C161.9 124.4, 160.2 143.3, 162.6 172.5 M160.1 108.1 C161.9 132.9, 160.5 156.5, 160.7 170.7 M159.6 171.1 C129.5 173.4, 100.5 171.1, 18.9 168.9 M160.6 170.7 C125.9 171.6, 88.2 171.1, 18.8 171.7 M21.2 170.4 C16.3 150.8, 17.1 134.9, 19.2 110.1 M18.2 170.9 C19.9 158, 19.6 143.9, 19.8 108.6" stroke-width="1.7"/><text class="t-ink" x="90" y="129.7" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">claim</text><text class="t-ink" x="90" y="150.4" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">pending → sending</text><path class="s-ink" d="M178.5 110.5 C220.1 107.1, 261.9 108, 322.5 107 M178 109.8 C233.4 109.6, 287.9 109.7, 320.6 109.5 M321.6 107.9 C321.2 124.7, 320.3 145.9, 321.9 169.3 M321.6 108.3 C320.6 124.9, 320.3 139.1, 320 170 M322.9 173.1 C290.6 170.9, 256.4 172.5, 178.7 170.6 M320.7 171.7 C288.1 169.4, 257 170.8, 178.7 170.6 M178.2 172.3 C180.1 145.9, 179 122.2, 177.7 111 M179.5 170.9 C180.5 146.1, 180.7 123.7, 179.2 108.6" stroke-width="1.7"/><text class="t-ink" x="250" y="129.7" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">call the</text><text class="t-ink" x="250" y="150.4" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">provider</text><path class="s-ink" d="M337.2 109.4 C381.9 111.9, 423.5 109.6, 479.4 109.6 M338.4 109 C367.4 110.3, 398.4 109.8, 481 109.2 M481.1 108.1 C480.6 129.3, 480.5 148.5, 481.2 170.5 M480.8 108.5 C480.7 129.2, 481.5 148.7, 481.6 171.5 M481.9 170.6 C447.3 172.9, 412.3 173.8, 338.5 172.4 M480.8 170.4 C452.5 172.6, 423.7 171.4, 338.7 171.8 M339.6 169.7 C339.5 153.5, 340.9 138.6, 340.5 107.5 M338.7 170.9 C339.6 148.7, 338.2 128.3, 338.6 108.6" stroke-width="1.7"/><text class="t-ink" x="410" y="129.7" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">record</text><text class="t-ink" x="410" y="150.4" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">sent + provider id</text><path class="s-ink" d="M500.3 108.3 C539.4 109.1, 585 108, 640.7 107.8 M498.7 108.2 C532 107.9, 563.5 108.9, 641.5 109 M640.6 108.4 C638.6 129.5, 639.2 146.6, 640.6 171.8 M640 108.8 C641.6 133.6, 641.3 156.1, 640.9 170.7 M640.8 172.6 C604 170.5, 568.2 170.8, 498.3 169.8 M640.8 171.4 C586.3 170.4, 533.5 171.2, 498.6 170.7 M501 171.6 C498.9 148.6, 498.3 125.8, 499 108.3 M500 170.9 C497.9 151.3, 499.2 132.9, 498 108.6" stroke-width="1.7"/><text class="t-ink" x="570" y="129.7" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">ack the</text><text class="t-ink" x="570" y="150.4" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">queue message</text><path class="s-ink" d="M165 139.2 C167.3 139.9, 169.1 139.9, 173.4 140.6 M165.1 140.2 C167.1 139.8, 168.6 139.9, 173.4 139.9" stroke-width="1.7"/><path class="s-ink" d="M161.5 146 C166.4 142.8, 168.6 142, 171.8 139.8 M173.6 139.7 C169.6 137.5, 167.4 135.9, 161.2 134.1" stroke-width="1.7"/><path class="s-ink" d="M325.8 140.1 C327 140.9, 330.4 140.1, 332.7 139.2 M325.4 139.6 C326.9 139.5, 329.3 140.1, 332.9 139.7" stroke-width="1.7"/><path class="s-ink" d="M322.6 144.7 C326 144.5, 327.9 142.6, 333.4 140.3 M331.9 140.4 C330.2 139.6, 326.6 136.2, 322.4 136.1" stroke-width="1.7"/><path class="s-ink" d="M484.8 139.2 C486.7 140.1, 489.9 140.3, 493.8 139.5 M484.8 139.8 C487.6 140.3, 490.1 140.4, 493.2 140.3" stroke-width="1.7"/><path class="s-ink" d="M481.1 145.9 C485.6 143.3, 489.8 142.9, 492.3 140.9 M492.8 141.1 C488.3 138.7, 486 136.2, 483.5 135.4" stroke-width="1.7"/><path class="s-red" d="M250.9 104.8 C251.6 103.3, 242 97.2, 254 95.3 C266.1 93.4, 310.2 94.9, 323 93.4 C335.8 91.9, 328.8 85.9, 330.9 86.1 C333 86.4, 323.5 93.6, 335.8 95 C348.1 96.4, 392.5 93.2, 404.9 94.7 C417.4 96.2, 409.3 102.5, 410.3 104.1 M249.7 104.1 C250.2 102.2, 240.3 95.2, 253 93.6 C265.7 92, 312.7 95.6, 325.8 94.6 C338.9 93.5, 330.3 87.2, 331.6 87.4 C333 87.7, 321.7 94.9, 334 96 C346.4 97.1, 393.1 92.7, 406 93.9 C418.8 95, 410.4 100.9, 411.2 102.7" stroke-width="1.6"/><text class="t-red" x="330" y="70" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="middle">duplicate window</text><path class="s-green" d="M170.1 176.9 C169.8 194.2, 170.9 208.5, 171.5 223.9 M170.6 177.3 C170.2 197.3, 170.7 216.8, 169.8 226" stroke-width="1.4" stroke-dasharray="6 7"/><text class="t-green" x="170" y="246" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">✕</text><text class="t-green" x="170" y="272" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">A</text><text class="t-green" x="30" y="312" font-size="19" font-weight="600" text-anchor="start" dominant-baseline="middle">A: provider never saw it.</text><text class="t-soft" x="30" y="334" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">Lease expires, another worker sends. Safe.</text><path class="s-red" d="M328.8 180.2 C331.7 193.3, 332.5 208.8, 328.5 226.5 M331 178.7 C330 188.5, 330.1 198.8, 330.2 225.7" stroke-width="1.4" stroke-dasharray="6 7"/><text class="t-red" x="330" y="246" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">✕</text><text class="t-red" x="330" y="272" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">B</text><text class="t-red" x="30" y="356" font-size="19" font-weight="600" text-anchor="start" dominant-baseline="middle">B: provider sent it, we never wrote &quot;sent&quot;.</text><text class="t-soft" x="30" y="378" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">Retry sends again. Keep this gap to milliseconds.</text><path class="s-blue" d="M492 179.1 C489.3 192.4, 489.8 204.7, 489.8 224.8 M489.2 177.9 C488.8 189.3, 490.7 200, 490.7 225.4" stroke-width="1.4" stroke-dasharray="6 7"/><text class="t-blue" x="490" y="246" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle">✕</text><text class="t-blue" x="490" y="272" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">C</text><text class="t-blue" x="30" y="400" font-size="19" font-weight="600" text-anchor="start" dominant-baseline="middle">C: &quot;sent&quot; is recorded, the ack is lost.</text><text class="t-soft" x="30" y="422" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">Redelivered, sees &quot;sent&quot;, skips. Safe.</text></svg>
