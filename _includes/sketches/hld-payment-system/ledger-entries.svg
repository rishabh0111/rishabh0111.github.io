<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" width="640" role="img" aria-labelledby="sk7y9pmht sk7y9pmhd"><title id="sk7y9pmht">Three double-entry ledger entries for one payment: capture, partial refund, settlement</title><desc id="sk7y9pmhd">Entry 1, payment captured: debit processor receivable 100.00, credit owed to merchant 96.80, credit fee revenue 3.20. Entry 2, refund of 25.00: debit owed to merchant 25.00, credit processor receivable 25.00. Entry 3, settlement: debit bank cash 75.00, credit processor receivable 75.00. In every entry debits equal credits. Balances after: processor receivable 0.00, bank cash 75.00, owed to merchant 71.80, fee revenue 3.20, and 75.00 held equals 71.80 owed plus 3.20 earned.</desc><text class="t-ink" x="24" y="20" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">every entry: total debits = total credits</text><text class="t-blue" x="24" y="50" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">debit (blue): value we hold or are owed arrives, or what we owe shrinks</text><text class="t-violet" x="24" y="74" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">credit (violet): an obligation or earnings arise, or held value leaves</text><text class="t-soft" x="430" y="100" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">debit</text><text class="t-soft" x="558" y="100" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">credit</text><text class="t-ink" x="24" y="132" font-size="19" font-weight="700" text-anchor="start" dominant-baseline="middle">1. pay_123 captured: $100.00, fee 2.9% + $0.30 = $3.20</text><path class="s-ink" d="M25.3 153.5 C129.1 153.5, 237.1 155.3, 361.3 152.8 M24 151.9 C148.7 155.1, 273.2 155.1, 359.8 152 M359.8 153.1 C361 161.9, 361.7 174, 359.6 187.9 M359.9 152.1 C359.4 165, 360.3 177.9, 359.1 188.8 M361.4 186.8 C259.3 188.1, 159 1