<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" role="img" aria-labelledby="skpyw2a9t skpyw2a9d"><title id="skpyw2a9t">Tokens in a bucket of capacity 10 refilling at 1 token a second, over eight seconds</title><desc id="skpyw2a9d">At t = 0 the bucket is full with 10 tokens. 12 requests arrive: 10 are allowed and empty the bucket, 2 are rejected with a retry hint of about one second. The bucket refills along a straight line to 3 tokens at t = 3. 5 requests arrive: 3 are allowed, 2 rejected. By t = 8 it has refilled to 5.</desc><text class="t-ink" x="20" y="26" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="middle">token bucket: capacity 10, refill 1 token a second</text><path class="s-soft" d="M79.4 330.5 C261.3 331.1, 442.6 329.8, 600.2 329.8 M79.7 330 C201.9 332.6, 323.1 331.8, 600.4 329.9" stroke-width="1.4"/><path class="s-soft" d="M81.3 330.1 C82.5 251.9, 81.9 171.1, 79.8 104.9 M79.8 329.3 C81.7 272.8, 82 214.6, 79.5 102.7" stroke-width="1.4"/><text class="t-soft" x="80" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">0</text><text class="t-soft" x="142" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">1</text><text class="t-soft" x="204" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">2</text><text class="t-soft" x="266" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">3</text><text class="t-soft" x="328" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">4</text><text class="t-soft" x="390" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">5</text><text class="t-soft" x="452" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">6</text><text class="t-soft" x="514" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">7</text><text class="t-soft" x="576" y="350" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">8</text><text class="t-soft" x="600.8" y="376" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">seconds</text><text class="t-soft" x="68" y="330" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">0</text><text class="t-soft" x="68" y="225" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">5</text><text class="t-soft" x="68" y="120" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">10</text><text class="t-soft" x="68" y="94" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">tokens</text><path class="s-soft" d="M80.1 119.6 C261.1 119.4, 442.1 119.1, 601.2 120.1 M80 120.2 C223.7 120.4, 367.6 120, 600.8 119.6" stroke-width="1.2" stroke-dasharray="6 7"/><text class="t-soft" x="600.8" y="106" font-size="18" font-weight="500" text-anchor="end" dominant-baseline="middle">capacity 10</text><path class="s-blue" d="M79.1 118.1 C81.2 192.5, 80.7 266, 80.3 328.7 M80.4 119.8 C82.6 182.9, 82.8 245.9, 82.3 330.9 M81.3 329.7 C125.1 317.5, 174.2 301.8, 265.6 269 M81.5 329.7 C142 307.3, 204 287.1, 265.5 267.5 M266.7 268.8 C264.1 282.2, 267.3 299.9, 268.5 330.1 M266.2 266.2 C267.7 280.9, 266.9 295.3, 268.1 330 M267.4 330.3 C347.4 301.5, 424.9 274.2, 577.4 225.4 M268.3 330.3 C373.4 294.1, 478.6 257.3, 575.4 225" stroke-width="2.6"/><text class="t-blue" x="470.6" y="293.4" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="middle" transform="rotate(-18 470.6 293.4)">refill: +1 a second</text><text class="t-ink" x="94" y="149.4" font-size="19" font-weight="700" text-anchor="start" dominant-baseline="middle">12 arrive at t=0:</text><text class="t-green" x="94" y="174.6" font-size="19" font-weight="700" text-anchor="start" dominant-baseline="middle">10 allowed</text><text class="t-red" x="94" y="199.8" font-size="19" font-weight="700" text-anchor="start" dominant-baseline="middle">2 rejected, retry ~1 s</text><text class="t-ink" x="280" y="213.4" font-size="19" font-weight="700" text-anchor="start" dominant-baseline="middle">5 arrive at t=3:</text><text class="t-green" x="280" y="238.6" font-size="19" font-weight="700" text-anchor="start" dominant-baseline="middle">3 allowed,</text><text class="t-red" x="358" y="238.6" font-size="19" font-weight="700" text-anchor="start" dominant-baseline="middle">2 rejected</text><path class="h-blue" d="M261.9 264.8 C261.9 264.8, 261.9 264.8, 261.9 264.8 M261.9 264.8 C261.9 264.8, 261.9 264.8, 261.9 264.8 M261.9 269.1 C264.2 267.4, 266.4 264.5, 267.7 263.5 M261.4 269.7 C264 267.4, 266.2 264.8, 267.7 262.6 M264.8 270.7 C266.5 268.2, 267.7 265.6, 269.4 264.6 M264.8 271.2 C266 269.7, 267.5 267.6, 269.8 265.2 M267.7 272 C269.6 271.1, 270.6 269.3, 272.3 266.5 M267.7 271.8 C268.6 270.1, 270.6 268.4, 272.3 267.2" stroke-width="1.1"/><path class="s-blue" d="M268 262.3 C269.1 262.8, 269.4 264.1, 269.9 264.9 C270.5 265.6, 271.2 265.8, 271.3 266.9 C271.4 268, 271.4 270.5, 270.4 271.3 C269.4 272.2, 266.6 272.1, 265.3 271.9 C264.1 271.7, 263.8 270.7, 263.1 270.2 C262.4 269.7, 261.3 269.9, 261.1 269 C261 268, 261.5 265.5, 262.1 264.5 C262.8 263.5, 263.8 263.4, 264.9 263.2 C265.9 263, 267.5 262.9, 268.6 263.2 C269.6 263.5, 270.9 264.8, 271.1 265 M264.3 260.9 C265.6 260.8, 268.4 261.9, 269.6 262.6 C270.7 263.2, 270.9 263.9, 271.1 264.7 C271.3 265.4, 270.9 266.3, 270.9 267.3 C270.8 268.3, 271.5 269.7, 270.6 270.6 C269.6 271.5, 266.3 272.8, 265.1 272.7 C263.9 272.7, 264 270.9, 263.2 270.2 C262.4 269.5, 260.5 269.4, 260.4 268.5 C260.3 267.7, 262.2 266.1, 262.7 265.1 C263.1 264.1, 262.5 262.8, 263 262.6 C263.6 262.4, 266 264.1, 266.1 264" stroke-width="1.7"/><path class="h-blue" d="M571.7 221.4 C571.7 221.4, 571.7 221.4, 571.7 221.4 M571.7 221.4 C571.7 221.4, 571.7 221.4, 571.7 221.4 M570.6 225.9 C573.2 224.3, 574.1 222.