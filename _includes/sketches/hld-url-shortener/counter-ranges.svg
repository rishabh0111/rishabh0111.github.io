<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" role="img" aria-labelledby="sk6qb7jet sk6qb7jed"><title id="sk6qb7jet">Link service instances lease blocks of 1,000 IDs from one counter and hand them out locally</title><desc id="sk6qb7jed">A number line of IDs split into blocks of 1,000. Server A holds 1,000,000 to 1,000,999 and has used 417 of them. Server B holds the next block and has used 680. Server C held the third block and crashed; its unused IDs are lost, which is harmless with 3.5 trillion codes. After restarting, C leased the fourth block. The durable counter stands at 1,004,000, where the next lease starts. One counter call per 1,000 links is 3.5 calls a second at the 3,500 a second peak.</desc><text class="t-ink" x="20" y="26" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="middle">one counter, leased in blocks of 1,000</text><path class="s-blue" d="M33.3 110.4 C67.9 111.8, 100.9 112.9, 147.9 111.4 M33.3 112.9 C58.7 112, 81.6 112.3, 145.5 111.9 M146.4 112.2 C143.5 133.2, 146.8 154.9, 144.8 166.5 M145.5 112.5 C147.6 134, 146.7 154, 146.9 167.4 M148.1 169.7 C108.2 165.3, 69.1 166.9, 33.4 169.8 M145 167.4 C108.5 168.2, 68.9 167.1, 35 168.9 M32.5 169 C36 150.5, 32.9 136.5, 34.4 111 M33.2 167.7 C34.2 154.4, 33.8 140.3, 34 111.6" stroke-width="1.6"/><path class="h-blue" d="M36.7 115.4 C36.7 115.4, 36.7 115.4, 36.7 115.4 M36.7 115.4 C36.7 115.4, 36.7 115.4, 36.7 115.4 M37.4 123.5 C38.7 120.8, 40 117.6, 43.2 115.3 M37.7 122.5 C39.5 119.7, 42.5 116.6, 43.5 115.3 M38.1 131.6 C41.6 125.5, 43 123.2, 50.2 114.4 M37.4 129.5 C41.3 124.9, 44 120.3, 50.6 115.5 M36.9 139.4 C42.4 130.6, 48.9 123.8, 58.9 116.3 M36 138 C43 130.2, 48.9 124.6, 57.9 113.7 M37.2 145.7 C42.5 140.3, 50.3 132.7, 63 115.6 M36.7 144.8 C46.3 134.3, 55.6 123.8, 62.7 114.1 M36.7 154.9 C47.9 143.2, 55 131.4, 71.8 116.7 M37 153.4 C49.6 140.2, 62.2 125.7, 70.3 116.2 M36 159 C51.5 140.9, 68.4 123.9, 75.8 113.6 M37.8 160.9 C48.8 147.2, 59.7