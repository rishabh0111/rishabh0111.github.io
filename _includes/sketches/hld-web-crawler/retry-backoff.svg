<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" role="img" aria-labelledby="skhxerh8t skhxerh8d"><title id="skhxerh8t">One URL retried with exponential backoff, then parked in a dead-letter queue</title><desc id="skhxerh8d">Attempts at 0, 1, 3, 7 and 15 minutes, the gaps doubling 1, 2, 4, 8 minutes. All five fail, so the URL moves to the dead-letter queue instead of retrying forever.</desc><text class="t-ink" x="20" y="24" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">a URL that keeps timing out: wait longer each time, then park it</text><text class="t-soft" x="20" y="56" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="middle">wait = 1 min × 2^(attempt − 1), plus a little random jitter; give up after 5</text><path class="s-soft" d="M49.9 149.7 C195.2 150.2, 341.7 150.7, 593.7 150.6 M49.7 149.7 C213.2 149.7, 376.1 149.9, 593.9 150.4" stroke-width="1.2"/><path class="h-red" d="M44.5 140.7 C44.5 140.7, 44.5 140.7, 44.5 140.7 M44.5 140.7 C44.5 140.7, 44.5 140.7, 44.5 140.7 M42.9 149.9 C46 146, 46.1 144.3, 49.7 139.6 M41.7 150.4 C44.1 147.4, 47.2 143.7, 49.9 140.6 M42.1 153.3 C45.1 152.5, 47.3 147.5, 53.1 139.8 M42.9 155.4 C45.6 150.9, 50.3 145.9, 53.5 141.6 M43 159.6 C47.1 154.9, 52.7 152.1, 56.1 142.9 M44.3 157.8 C48 154.8, 52 151, 56.9 143.9 M49.5 157.3 C51.2 157.7, 55.8 153.6, 60.1 148.9 M50.7 159 C51.6 156.6, 54.2 153.5, 59.1 148.2 M55.9 157.7 C57.2 156.9, 58.2 155.7, 58.5 154.3 M56.3 157.5 C56.9 157.1, 57.2 156.4, 58.9 154.5" stroke-width="1.1"/><path class="s-red" d="M44.8 140.3 C46.4 139.3, 50.1 139.7, 52.2 140.3 C54.4 141, 56.7 142.6, 57.9 144.2 C59.1 145.8, 59.4 148, 59.4 150 C59.4 151.9, 59.2 154.7, 57.9 156.1 C56.6 157.6, 53.8 158.2, 51.6 158.6 C49.4 159, 46.4 159.4, 44.7 158.6 C43.1 157.8, 42.1 156.1, 41.5 153.8 C40.9 151.6, 40.4 147.3, 41.1 145.3 C41.8 143.3, 44.8 142.5, 45.7 141.7 C46.6 140.8, 46.5 140.2, 46.4 140.1 M46.6 140.9 C48.7 140.4, 53.2 140.9, 55