<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" role="img" aria-labelledby="skoqy87lt skoqy87ld"><title id="skoqy87lt">Two transfers deadlock when each locks its own source account first; lock ordering removes the cycle</title><desc id="skoqy87ld">Left: thread 1 to 2 holds lock 1 and waits for lock 2, thread 2 to 1 holds lock 2 and waits for lock 1, a cycle. Right: both threads lock account 1 first, so thread 2 to 1 waits while holding nothing, and thread 1 to 2 can take lock 2 and finish.</desc><text class="t-ink" x="165" y="24" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">lock in call order</text><text class="t-ink" x="495" y="24" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="middle">lock lower id first</text><path class="s-soft" d="M331 15 C327.8 121.6, 327.7 232.1, 330.1 329.3 M330 13.5 C332.3 102.5, 332.1 191.5, 329.6 330.7" stroke-width="1.2" stroke-dasharray="6 7"/><path class="h-amber" d="M117.3 70.2 C117.3 70.2, 117.3 70.2, 117.3 70.2 M117.3 70.2 C117.3 70.2, 117.3 70.2, 117.3 70.2 M117.8 78.9 C118.9 77.5, 122.1 75.7, 125.1 71.4 M117 78.8 C120.6 76.2, 123 72.8, 125.6 70.8 M118.5 88.1 C118.7 83, 125.2 81.5, 132.6 70.1 M116.5 89.5 C123.6 83.3, 127.3 74.9, 132 69.9 M115.1 96.6 C122.7 89.1, 134 80.4, 142.4 70.4 M117.5 98 C124.1 88.6, 133.2 79.7, 140.8 69.6 M116.4 107.5 C124.5 98.5, 133.7 85.5, 146.6 72.2 M117.2 106.6 C125.7 97.8, 134.2 88.7, 147.7 70.9 M119.2 113 C127.3 106.9, 134.6 96.3, 156.1 70 M118.8 115.1 C128.6 104.7, 137.1 93.4, 156.2 70 M126.5 113.4 C139.6 102.7, 149.9 87.3, 165 70.7 M125.5 115.7 C137.8 100.4, 150.7 87, 165.1 71.4 M133.5 113.4 C143.6 104.7, 154.7 93, 173.1 72.1 M134.7 113.6 C146.5 100.6, 160.2 85.4, 172.2 71 M140.9 113.1 C153.4 100.2, 163.4 90.5, 180.8 71.2 M143.1 113.7 C149.7 106.1, 159.1 95, 181.3 70.8 M149.1 116.5 C160.5 102.7, 172.7 86.8, 186.7 72.5 M150.8 113.6 C163.3 98.1, 177.8 82.7, 187.8 70.2 M157 112.9 C170.5 104.1, 181 