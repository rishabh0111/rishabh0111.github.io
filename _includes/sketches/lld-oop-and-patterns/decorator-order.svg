<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" role="img" aria-labelledby="skdxvbjbt skdxvbjbd"><title id="skdxvbjbt">Decorator order matters: count(retry(flaky)) against retry(count(flaky))</title><desc id="skdxvbjbd">Left: a counting notifier wraps a retrying notifier (up to 3 tries), which wraps a notifier that fails twice and then succeeds. The caller makes one send, the retry layer makes three, and the counter sees 1 call. Right: the retry layer is outermost and the counter sits inside it, so the counter sees all 3 attempts. Both deliver the message.</desc><text class="t-ink" x="20" y="24" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="middle">same three wrappers, two orders, two different counts</text><path class="s-violet" d="M19.5 94.9 C111.9 95.8, 203.2 96.7, 331.4 95.6 M19.5 96.7 C86.2 95.3, 151.1 95.5, 329.7 95.9 M330.3 96.1 C326.9 179.3, 329.7 263.1, 329 320.8 M329.6 96.4 C333 182.3, 332.2 267, 330.8 321.5 M331.5 323.2 C225.3 319.2, 119.7 320.3, 19.5 323.3 M329.3 321.6 C225 321.8, 118.5 321, 20.7 322.6 M18.7 322.8 C23.1 256.7, 20.4 194.4, 20.4 95.1 M19.4 321.7 C19.7 264.9, 19.4 207.3, 20 95.6" stroke-width="1.8"/><text class="t-violet" x="32" y="116" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="middle">Counting</text><path class="s-blue" d="M38.5 143.3 C118.2 143, 197.5 144.8, 309.1 143.6 M39.8 142.1 C103.1 142.5, 165 142.3, 310 141.7 M309.8 142.4 C311.2 204.8, 310.8 265.7, 308.1 305.8 M310.9 142.7 C310.7 183.5, 310.9 223.9, 310.3 306.9 M310.8 305.4 C213.8 304.7, 118.5 305.4, 39.4 305.3 M309.3 306.3 C224.2 307.8, 140.2 308.4, 40.7 305.8 M39.9 304.5 C39.1 244.3, 38.5 183, 38.9 141.9 M40.6 305.6 C40.8 271.1, 41 235.1, 39.4 141.6" stroke-width="1.8"/><text class="t-blue" x="52" y="162" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="middle">Retrying (max 3)</text><path class="s-amber" d="M61 188.4 C127.9 185.4, 195.2 188.4, 290.1 188.2 M60.1 187.4 C118.2 189.6, 177.2 188.8, 290.4 187.4 M289.3 188.7 C290.8 207.5, 291.2 227.3, 291.8 291 M290.1 188.9 C288.9 221.3, 290.3 252.1, 289.6 290.2 M290 291 C203.3 290.4, 119.8 287, 59.2 290.7 M289.3 289.2 C223.2 290.9, 156.4 289.4, 60.7 290.8 M61.3 290.4 C59.2 263.2, 61.1 238.3, 61.7 188.8 M59.7 289.6 C61.4 250.2, 59.9 210.8, 61 187.6" stroke-width="2.4"/><text class="t-amber" x="72" y="208" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="middle">Flaky (fails twice)</text><text class="t-ink" x="175" y="238" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="middle">fail, fail, ok</text><text class="t-soft" x="175" y="266" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="middle">attempts 1, 2, 3</text><path class="s-ink" d="M175 55.4 C176.7 68, 175.9 79, 176.5 90.5 M175.5 56.7 C174.2 65.8, 174.6 76.4, 175.9 91.1" stroke-width="1.7"/><path class="s-ink" d="M169 80.1 C170.9 84.6, 171.8 88.8, 174 92.7 M176 91.9 C177.4 88.5, 178.9 85.3, 179.2 82.4" stroke-width="1.7"/><text class="t-ink" x="115" y="74" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">send() once</text><text class="t-violet" x="175" y="352" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">counter sees 1 call</text><path class="s-blue" d="M351.3 97.1 C442.3 95.7, 532.6 94.5, 659.8 95.5 M349.3 95.3 C448.6 96.6, 546.9 96.2, 659.7 96.5 M658.1 97.3 C661.7 154, 660.2 210.1, 659.9 322.3 M660 95.5 C658.2 168, 658.5 241.9, 659.9 322.2 M660.9 320.8 C592.4 319.9, 526.4 322, 348.9 323.3 M659.5 321.8 C591.2 321, 523.9 320.7, 350.5 322 M350.9 323.4 C352 251.2, 348.7 178, 351.3 95.1 M349.4 321.7 C348.7 260.4, 348.9 197.4, 349.2 95.6" stroke-width="1.8"/><text class="t-blue" x="362" y="116" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="middle">Retrying (max 3)</text><path class="s-violet" d="M370.5 142.3 C448.6 142.8, 530.3 142.5, 640.8 143.5 M369.6 142.4 C46