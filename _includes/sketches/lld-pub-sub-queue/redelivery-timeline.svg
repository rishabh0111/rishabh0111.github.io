<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" role="img" aria-labelledby="ski1hwi3t ski1hwi3d"><title id="ski1hwi3t">Billing loses its lease and offset 1 is delivered again</title><desc id="ski1hwi3d">At 09:00:00 billing polls offsets 0 and 1 and acks 0. Its lease on the in-flight offset 1 lasts until 09:00:30. No ack arrives. At 09:00:31 the next poll rewinds to the committed offset and delivers 1, 2 and 3. Offset 1 has been delivered twice, so the handler must be idempotent.</desc><path class="s-ink" d="M69.6 200.8 C221.2 198.6, 373.2 197.9, 614.1 200.5 M70 199.7 C200 198.1, 329.8 198, 614.1 199.7" stroke-width="1.6"/><path class="s-ink" d="M68.7 194.5 C70.3 198, 70.7 200.9, 71 205.7 M70.3 194.4 C70.1 197.1, 69.8 199.7, 70.4 205.4" stroke-width="1.4"/><text class="t-soft" x="70" y="226" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">:00</text><path class="s-ink" d="M230.6 193.8 C228.8 197.4, 229 201.1, 229.2 207.3 M230.5 193.9 C229.5 197.2, 230.3 201, 229.4 206.6" stroke-width="1.4"/><text class="t-soft" x="230" y="226" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">:10</text><path class="s-ink" d="M389.8 193.1 C390 196.9, 390 201.3, 390 206.2 M389.4 193.5 C390.6 197.4, 389.8 201, 389.7 206.4" stroke-width="1.4"/><text class="t-soft" x="390" y="226" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">:20</text><path class="s-ink" d="M549.1 195.1 C551.1 196.3, 551 201.4, 550.8 205.2 M549.7 194.3 C550.1 197.5, 550.4 202.4, 549.9 206.2" stroke-width="1.4"/><text class="t-soft" x="550" y="226" font-size="18" font-weight="500" text-anchor="middle" dominant-baseline="middle">:30</text><text class="t-soft" x="618" y="226" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">s</text><path class="h-amber" d="M70.2 149.8 C70.2 149.8, 70.2 149.8, 70.2 149.8 M70.2 149.8 C70.2 149.8, 70.2 149.8, 70.2 149.8 M7