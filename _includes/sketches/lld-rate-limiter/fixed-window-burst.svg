<svg class="sketch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" width="620" role="img" aria-labelledby="skw58npct skw58npcd"><title id="skw58npct">Fixed windows let twice the limit through around a boundary</title><desc id="skw58npcd">Limit 5 per second with fixed windows starting at 0 s and 1 s. Five requests arrive between 0.8 and 1.0 seconds, the last five allowed in the first window, and five more between 1.0 and 1.2 seconds, the first five of the second window. Each window counts 5 and allows them all, but 10 requests passed within 0.4 seconds.</desc><text class="t-ink" x="20" y="24" font-size="21" font-weight="700" text-anchor="start" dominant-baseline="middle">limit 5 per second, fixed windows</text><path class="s-soft" d="M51.5 81.1 C117.9 82.5, 183.4 83.2, 310.5 78.8 M49.5 79.4 C132.3 81.4, 213.5 82.1, 309.3 80 M311.5 80 C311.4 102.3, 308.5 127.4, 311.4 171 M309.4 79.2 C308.8 100.2, 310.1 122.3, 309.8 169.1 M309 170.8 C256.5 167.7, 201.5 167.6, 50.4 170.2 M309.6 169.3 C243.3 172, 175.9 172.3, 49.8 170.1 M51.8 172.2 C49.8 148.2, 52 127.1, 50.2 78.4 M49.8 169.7 C50.7 140.5, 50.7 110.9, 50 80.1" stroke-width="1.6"/><path class="s-soft" d="M310.5 80.2 C375.9 79, 444.7 80.7, 571.5 80.9 M309.8 80.5 C397.3 78, 483.8 78.2, 569.7 79.8 M571 80.3 C571 103, 568.8 126.5, 570.7 167.9 M570.8 79.4 C571.4 106.6, 569.5 135.7, 569.2 170.6 M571.6 168.8 C511.6 169.3, 453.6 168.7, 310.2 171.6 M569.7 170 C508.6 169.3, 448.3 169.4, 309.8 169.3 M308.8 169.7 C309.2 140.9, 309.6 113.8, 308.7 79.3 M308.9 169.7 C309.3 144.1, 309.9 117.5, 309.4 80" stroke-width="1.6"/><text class="t-soft" x="76" y="100" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">window [0 s, 1 s): 5</text><text class="t-soft" x="336" y="100" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="middle">window [1 s, 2 s): 5</text><path class="h-green" d="M206.3 134.2 C206.3 134.2, 206.3 134.2, 206.3 134.2 M206.3 134.2 C206.3 134.2, 206.3 134.2, 206.3