    @media (prefers-color-scheme: dark) { .m { fill: #ECEFF4; } .r { stroke: #ECEFF4; } }
  </style>
  <path class="m" d="M16 6A10 10 0 0 1 16 26A5 5 0 0 1 16 16A5 5 0 0 0 16 6ZM16 19.3A1.7 1.7 0 1 0 16 22.7A1.7 1.7 0 1 0 16 19.3Z" fill-rule="evenodd"/>
