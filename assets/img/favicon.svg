    @media (prefers-color-scheme: dark) { .m { fill: #ECEAE6; } .s { fill: #FF6B52; } }
  </style>
  <circle class="s" cx="23" cy="8.5" r="3.6"/>
  <path class="m" d="M2 27 L12 11 L18 20 L22 15 L30 27 Z"/>
</svg>
